name: Deploy to Shopify

on:
  push:
    branches:
      - main
      - claude/shopify-direct-changes-rtq6if

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy theme to Shopify
        env:
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          shopify theme push \
            --theme ${{ secrets.SHOPIFY_THEME_ID }} \
            --store ${{ secrets.SHOPIFY_STORE_URL }} \
            --no-color \
            --allow-live
